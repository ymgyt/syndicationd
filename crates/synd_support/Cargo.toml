[package]
authors.workspace    = true
categories.workspace = true
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
repository.workspace = true

description = "shared support utilities for syndicationd crates"
name        = "synd-support"
readme      = "README.md"
version.workspace = true

[dependencies]
axum                               = { workspace = true, optional = true }
bon                                = { workspace = true, optional = true }
chrono                             = { workspace = true, features = ["now"] }
directories                        = "6.0.0"
dom_query                          = { workspace = true, optional = true }
dom_smoothie                       = { workspace = true, optional = true }
humantime                          = { version = "2.4.0", optional = true }
mockall                            = { workspace = true, optional = true }
opentelemetry                      = { version = "0.33.1", optional = true }
opentelemetry-appender-tracing     = { version = "0.33.1", optional = true, default-features = false }
opentelemetry-http                 = { version = "0.33.1", optional = true }
opentelemetry-otlp                 = { version = "0.33.1", optional = true, default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "tls-ring"] }
opentelemetry-semantic-conventions = { version = "0.33.1", optional = true, features = ["semconv_experimental"] }
opentelemetry-stdout               = { version = "0.33.1", optional = true, default-features = false, features = ["metrics"] }
opentelemetry_sdk                  = { version = "0.33.1", optional = true, features = ["logs", "rt-tokio"] }
rand                               = { workspace = true, optional = true }
reqwest                            = { workspace = true, optional = true }
serde                              = { workspace = true, features = ["derive"] }
supports-color                     = { version = "3.0.2", optional = true }
thiserror                          = { workspace = true, optional = true }
tracing                            = { workspace = true }
tracing-opentelemetry              = { version = "0.34.0", optional = true }
tracing-subscriber                 = { workspace = true, optional = true, features = ["registry", "fmt", "std", "chrono"] }
unicode-segmentation               = { workspace = true, optional = true }
unicode-width                      = { workspace = true, optional = true }
url                                = { workspace = true, optional = true }

[features]
color = ["dep:supports-color"]
conf = []
html = ["dep:bon", "dep:dom_query", "dep:dom_smoothie", "dep:thiserror", "dep:unicode-segmentation", "dep:unicode-width", "dep:url"]
humantime = ["dep:humantime"]
mock = ["dep:mockall"]
o11y = [
  "dep:axum",
  "dep:opentelemetry",
  "dep:opentelemetry-appender-tracing",
  "dep:opentelemetry-http",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry-semantic-conventions",
  "dep:opentelemetry_sdk",
  "dep:rand",
  "dep:reqwest",
  "dep:tracing-opentelemetry",
  "dep:tracing-subscriber",
]
opentelemetry-stdout = ["o11y", "dep:opentelemetry-stdout"]

[dev-dependencies]
insta               = { workspace = true, features = ["yaml", "redactions"] }
opentelemetry-proto = { version = "0.33.1", features = ["gen-tonic", "trace", "metrics", "logs", "with-serde"] }
serde_json          = { workspace = true }
tokio               = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tonic               = { version = "0.14.9", features = ["transport"] }

[lints]
workspace = true
