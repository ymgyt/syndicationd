[package]
authors.workspace    = true
categories.workspace = true
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
repository.workspace = true

description = "Library to handle syndication spec"
name        = "synd-feed"
readme      = "README.md"
version.workspace = true

[dependencies]
anyhow        = { workspace = true }
async-graphql = { workspace = true, optional = true }
async-trait   = { workspace = true }
bon           = { workspace = true }
chrono        = { workspace = true, features = ["clock", "std"] }
fake          = { workspace = true, optional = true, features = ["derive"] }
feed-rs       = { workspace = true }
futures-util  = { workspace = true }
rand          = { workspace = true, optional = true }
reqwest       = { workspace = true, features = ["stream"] }
schemars      = { workspace = true, optional = true, features = ["derive", "url"] }
serde         = { workspace = true }
serde_json    = { workspace = true }
sha2          = { workspace = true }
sqlx          = { workspace = true, optional = true, features = ["sqlite"] }
thiserror     = { workspace = true }
tracing       = { workspace = true }
url           = { workspace = true, features = ["serde"] }

[features]
fake       = ["dep:fake", "dep:rand"]
graphql    = ["dep:async-graphql"]
jsonschema = ["dep:schemars"]
sqlx       = ["dep:sqlx"]

[lints]
workspace = true

[package.metadata.dist]
dist = false
