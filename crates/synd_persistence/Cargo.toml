[package]
authors.workspace    = true
categories.workspace = true
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
repository.workspace = true

description = "Persistence adapters for syndicationd"
name        = "synd-persistence"
readme      = "README.md"
version.workspace = true

[dependencies]
synd-feed     = { workspace = true, features = ["sqlx"] }
synd-registry = { workspace = true }

chrono     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
sqlx       = { workspace = true, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
thiserror  = { workspace = true }
tracing    = { workspace = true }
zstd       = { workspace = true }

[dev-dependencies]
anyhow       = { workspace = true }
synd-support = { workspace = true }
synd-test    = { workspace = true }
tempfile   = { workspace = true }
tokio      = { workspace = true, features = ["macros", "net", "rt", "time"] }
tokio-util = { workspace = true }

[lints]
workspace = true
