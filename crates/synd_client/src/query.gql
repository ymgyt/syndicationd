query InitialFeedView($subscriptionsFirst: Int!, $timelineFirst: Int!) {
  output: feedRegistry {
    subscriptions(first: $subscriptionsFirst) {
      nodes {
        ...SubscribedFeed
      }
      pageInfo {
        ...PageInfo
      }
    }
    timeline {
      entries(first: $timelineFirst) {
        nodes {
          ...Entry
        }
        pageInfo {
          ...PageInfo
        }
      }
    }
  }
}

query Subscription($after: String, $first: Int) {
  output: subscription {
    feeds(after: $after, first: $first) {
      nodes {
        ...SubscribedFeed
      }
      pageInfo {
        ...PageInfo
      }
    }
  }
}

query Entries($after: String, $first: Int!) {
  output: subscription {
    entries(after: $after, first: $first) {
      nodes {
        ...Entry
      }
      pageInfo {
        ...PageInfo
      }
    }
  }
}

query FeedEntries($url: FeedUrl!, $after: String, $first: Int!) {
  output: subscription {
    entries(url: $url, after: $after, first: $first) {
      nodes {
        ...Entry
      }
      pageInfo {
        ...PageInfo
      }
    }
  }
}

query FeedStatus($url: FeedUrl!) {
  output: subscription {
    feedStatus(url: $url) {
      ...RefreshStatus
    }
  }
}

subscription FeedEvents {
  feedEvents {
    __typename
    ... on TimelineChanged {
      changedAt
      affectedFeeds
    }
  }
}

fragment SubscribedFeed on SubscribedFeed {
  url
  requirement
  category
  crawlPolicy {
    polling {
      kind
      intervalSeconds
    }
  }
  refreshStatus {
    ...RefreshStatus
  }
  feed {
    type
    title
    updated
    websiteUrl
    description
    generator
    entries(first: 10) {
      nodes {
        ...EntryMeta
      }
    }
    links {
      nodes {
        ...Link
      }
    }
    authors {
      nodes
    }
  }
}

fragment Entry on Entry {
  id
  title
  published
  updated
  summary
  websiteUrl
  feed {
    title
    url
    requirement
    category
  }
}

fragment EntryMeta on Entry {
  title
  published
  updated
  summary
}

fragment Link on Link {
  href
  rel
  mediaType
  title
}

fragment PageInfo on PageInfo {
  hasNextPage
  endCursor
}

fragment RefreshStatus on RefreshStatus {
  state
  requestId
  lastAttemptAt
  lastSuccessAt
  lastFailureAt
  lastErrorMessage
}
