query TimelineChanges($timelineId: ID!, $since: Int!, $first: Int!) {
  output: feedRegistry {
    timeline(timelineId: $timelineId) {
      changes(since: $since, first: $first) {
        changes {
          __typename
          ... on TimelineChangeUpsert {
            timelineEntry {
              orderTime
              entry {
                id
                title
                published
                updated
                labels
                excerpt {
                  text
                }
                websiteUrl
                feed {
                  title
                  url
                  labels
                }
              }
            }
          }
          ... on TimelineChangeRemove {
            entryId
          }
        }
        seq
        hasMore
      }
    }
  }
}
