query Subscription($after: String, $first: Int) {
  output: feedRegistry {
    feeds: subscriptions(after: $after, first: $first) {
      nodes {
        url
        requirement
        category
        crawlPolicy {
          polling {
            kind
            intervalSeconds
          }
        }
        feed {
          type
          title
          updated
          websiteUrl
          description
          generator
          entries(first: 10) {
            nodes {
              title
              published
              updated
              summary
            }
          }
          links {
            nodes {
              href
              rel
              mediaType
              title
            }
          }
          authors {
            nodes
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
