[package]
authors.workspace    = true
categories.workspace = true
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
repository.workspace = true

description = "syndicationd API client"
name        = "synd-client"
readme      = "README.md"
version.workspace = true

[dependencies]
synd-feed     = { workspace = true }
synd-protocol = { workspace = true }
synd-support  = { workspace = true, features = ["o11y"] }

fake              = { workspace = true, optional = true }
futures-util      = { workspace = true, features = ["sink"] }
graphql_client    = { workspace = true }
reqwest           = { workspace = true }
rustls            = { workspace = true }
serde             = { workspace = true, features = ["derive"] }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tokio             = { workspace = true, features = ["net", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing           = { workspace = true }
url               = { workspace = true }
webpki-roots      = { workspace = true }

[features]
fake = ["dep:fake", "synd-feed/fake"]

[dev-dependencies]
fake = { workspace = true }
synd-feed = { workspace = true, features = ["fake"] }

[lints]
workspace = true
