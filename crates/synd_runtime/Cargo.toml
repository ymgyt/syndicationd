[package]
authors.workspace    = true
categories.workspace = true
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
repository.workspace = true

description = "Runtime session and singleton daemon lifecycle for syndicationd"
name        = "synd-runtime"
readme      = "README.md"
version.workspace = true

[dependencies]
synd-api         = { workspace = true }
synd-client      = { workspace = true }
synd-persistence = { workspace = true }
synd-protocol    = { workspace = true }
synd-registry    = { workspace = true }
synd-support     = { workspace = true, features = ["humantime"] }

rustix     = { version = "1.1.4", features = ["fs", "process"] }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }
tokio      = { workspace = true, features = ["macros", "net", "rt", "time"] }
tracing    = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
url = { workspace = true }

[lints]
workspace = true
